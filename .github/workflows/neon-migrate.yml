name: Initialize Neon database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN to apply database migrations and initialize required roles
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: inputs.confirm == 'RUN' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply migrations and bootstrap required data
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing GitHub Actions secret NEON_DIRECT_DATABASE_URL."
            exit 1
          fi

          case "$DATABASE_URL" in
            *-pooler*)
              echo "Use the direct, unpooled Neon connection URL for migrations."
              exit 1
              ;;
          esac

          case "$DATABASE_URL" in
            postgresql://*) export DATABASE_URL="postgresql+psycopg://${DATABASE_URL#postgresql://}" ;;
            postgres://*) export DATABASE_URL="postgresql+psycopg://${DATABASE_URL#postgres://}" ;;
          esac

          case "$DATABASE_URL" in
            postgresql+psycopg://*) ;;
            *) echo "The secret must be a PostgreSQL connection URL."; exit 1 ;;
          esac

          python -m alembic upgrade head
          python -m app.db.seed --no-demo
